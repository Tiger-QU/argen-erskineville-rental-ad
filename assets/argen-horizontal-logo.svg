<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800" role="img" aria-labelledby="title desc">
  <title id="title">Argen horizontal logo</title>
  <desc id="desc">Argen home and horizon symbol with a wordmark, tagline, and mission statement.</desc>
  <rect width="2400" height="800" fill="#FFFFFF"/>
  <image href="argen-mark.png" x="70" y="90" width="530" height="530" preserveAspectRatio="xMidYMid meet"/>
  <text x="650" y="390" fill="#1E3A8A" font-family="Avenir Next, Avenir, Inter, Arial, sans-serif" font-size="295" font-weight="700" letter-spacing="-12">Argen</text>
  <text x="660" y="535" fill="#1E3A8A" font-family="Avenir Next, Avenir, Inter, Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="16">A HOME FOR YOUR NEXT CHAPTER</text>
  <line x1="1835" y1="142" x2="1835" y2="655" stroke="#CBD5E1" stroke-width="4"/>
  <g fill="#64748B" font-family="Avenir Next, Avenir, Inter, Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="8">
    <text x="1910" y="285">SUPPORTING</text>
    <text x="1910" y="352">INTERNATIONAL</text>
    <text x="1910" y="419">STUDENTS</text>
    <text x="1910" y="486">TOWARDS A</text>
    <text x="1910" y="553">BRIGHTER TOMORROW</text>
  </g>
</svg>